[project]
name = "sentinel-ops"
version = "0.1.0"
description = "Sentinel Ops Monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "django>=5.0,<6.0",
    "django-ninja>=1.3.0,<2.0",
    "psycopg[binary]>=3.1",
    "openai>=2.37.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiocache>=0.12.0",
    "slowapi>=0.1.0",
    "requests>=2.34.2",
    "smolagents>=1.26.0",
    "ddgs>=9.14.4",
    "bs4>=0.0.2",
    "httpx>=0.27.0,<1.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio==0.26.0",
    "pytest-django>=4.5.0",
    "alembic>=1.14.0",
    "rich>=13.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
]

[project.scripts]
openwindow = "openwindow.runner.loop_runner:main"
openwindow-api = "openwindow.runner.api_runner:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["apps/openwindow"]
include = ["openwindow*"]
